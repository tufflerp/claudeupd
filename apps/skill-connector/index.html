<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Connector</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --text: #1f1e1d; --muted: #6b6a68;
    --border: #e4e2dc; --accent: #c15f3c; --accent-text: #ffffff; --code: #f3f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --panel: #30302e; --text: #f0eee6; --muted: #a09f9a;
      --border: #444442; --accent: #d97757; --accent-text: #1f1e1d; --code: #1f1e1d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --panel: #30302e; --text: #f0eee6; --muted: #a09f9a;
    --border: #444442; --accent: #d97757; --accent-text: #1f1e1d; --code: #1f1e1d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 48px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { main { grid-template-columns: 1fr 1fr; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  input[type="search"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .list { max-height: 520px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  label.skill { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  label.skill:last-child { border-bottom: 0; }
  label.skill:hover { background: var(--bg); }
  label.skill input { margin-top: 4px; }
  .skill-name { font-weight: 600; font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .skill-desc { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; max-height: 360px; font: 12.5px/1.45 ui-monospace, monospace; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Skill Connector</h1>
  <p>Pick the skills you want, then copy the setup for Claude Code, a CLAUDE.md file, or the Claude API.</p>
</header>

<main>
  <section>
    <h2>1. Choose skills</h2>
    <input type="search" id="search" placeholder="Search by name or description" aria-label="Search skills">
    <div class="toolbar">
      <button id="select-visible">Select shown</button>
      <button id="clear">Clear</button>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section>
    <h2>2. Connect to Claude</h2>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="code" aria-selected="true">Claude Code</button>
      <button role="tab" data-mode="claudemd" aria-selected="false">CLAUDE.md</button>
      <button role="tab" data-mode="api" aria-selected="false">Claude API</button>
    </div>
    <p class="hint" id="hint"></p>
    <pre id="output"></pre>
    <div class="toolbar">
      <button class="primary" id="copy">Copy</button>
      <span class="count" id="copy-status"></span>
    </div>
  </section>
</main>

<script src="skills-data.js"></script>
<script>
(function () {
  var skills = window.SKILLS || [];
  var selected = new Set();
  var mode = 'code';

  var $ = function (id) { return document.getElementById(id); };
  var search = $('search'), list = $('list'), output = $('output'), hint = $('hint');
  var count = $('count'), copyStatus = $('copy-status');

  var HINTS = {
    code: 'Run in a terminal from the repository root. Copies each selected skill into your Claude Code skills folder.',
    claudemd: 'Paste into CLAUDE.md at the root of your project. Claude Code reads it automatically at the start of each session.',
    api: 'Use as the system prompt in a Claude API request. Contains the full text of each selected skill.'
  };

  function visible() {
    var q = search.value.trim().toLowerCase();
    if (!q) return skills;
    return skills.filter(function (s) {
      return s.name.toLowerCase().indexOf(q) !== -1 || s.description.toLowerCase().indexOf(q) !== -1;
    });
  }

  function chosen() {
    return skills.filter(function (s) { return selected.has(s.name); });
  }

  function renderList() {
    var shown = visible();
    list.textContent = '';
    if (!shown.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No skills match your search.';
      list.appendChild(empty);
    }
    shown.forEach(function (s) {
      var label = document.createElement('label');
      label.className = 'skill';
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = selected.has(s.name);
      box.addEventListener('change', function () {
        if (box.checked) selected.add(s.name); else selected.delete(s.name);
        update();
      });
      var text = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'skill-name';
      name.textContent = s.name;
      var desc = document.createElement('div');
      desc.className = 'skill-desc';
      desc.textContent = s.description;
      text.appendChild(name);
      text.appendChild(desc);
      label.appendChild(box);
      label.appendChild(text);
      list.appendChild(label);
    });
    count.textContent = selected.size + ' selected of ' + skills.length;
  }

  function shellQuote(value) {
    return "'" + value.replace(/'/g, "'\\''") + "'";
  }

  function render() {
    var picks = chosen();
    hint.textContent = HINTS[mode];
    if (!picks.length) {
      output.textContent = 'Select at least one skill to generate the setup.';
      return;
    }
    if (mode === 'code') {
      output.textContent = [
        'mkdir -p ~/.claude/skills',
        picks.map(function (s) {
          return 'cp -r skills/' + shellQuote(s.name) + ' ~/.claude/skills/';
        }).join('\n')
      ].join('\n');
    } else if (mode === 'claudemd') {
      output.textContent = '# Skills\n\nUse these skills when the task matches:\n\n' +
        picks.map(function (s) { return '- **' + s.name + '**: ' + s.description; }).join('\n') + '\n';
    } else {
      output.textContent = picks.map(function (s) {
        return '## Skill: ' + s.name + '\n\n' + s.body;
      }).join('\n\n---\n\n');
    }
  }

  function update() {
    renderList();
    render();
  }

  search.addEventListener('input', renderList);

  $('select-visible').addEventListener('click', function () {
    visible().forEach(function (s) { selected.add(s.name); });
    update();
  });

  $('clear').addEventListener('click', function () {
    selected.clear();
    update();
  });

  document.querySelectorAll('[role="tab"]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      mode = tab.getAttribute('data-mode');
      document.querySelectorAll('[role="tab"]').forEach(function (t) {
        t.setAttribute('aria-selected', String(t === tab));
      });
      render();
    });
  });

  $('copy').addEventListener('click', function () {
    var text = output.textContent;
    var done = function (ok) { copyStatus.textContent = ok ? 'Copied' : 'Copy failed'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      done(false);
    }
  });

  if (!skills.length) {
    count.textContent = 'No skills data found. Run: node scripts/skill-connector-build.js';
  }
  update();
})();
</script>
</body>
</html>
